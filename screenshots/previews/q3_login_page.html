<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Student Portal</title>
    <link rel="stylesheet" href="../../q3_servlet_portal/web/style.css">
</head>
<body class="login-body">

    <div class="login-card">
        <div class="login-header">
            <div class="login-icon">🔐</div>
            <h2>Student Portal Login</h2>
            <p>Access student profiles, photos, and verification documents</p>
        </div>

        <form class="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" value="admin" placeholder="e.g. admin">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" value="••••••••••••" placeholder="••••••••">
            </div>

            <button type="button" class="btn btn-primary btn-block">Sign In to Portal</button>
        </form>

        <div class="login-footer">
            <small>Default test credentials: <strong>admin</strong> / <strong>password123</strong></small>
        </div>
    </div>

</body>
</html>
